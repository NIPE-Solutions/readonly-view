name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Exact package.json version
                required: true
            channel:
                description: npm distribution tag
                required: true
                type: choice
                options: [next, latest]
            confirmation:
                description: Type publish <version> with <channel>
                required: true

permissions:
    contents: read

jobs:
    authorize:
        runs-on: ubuntu-latest
        steps:
            - name: Require main and exact release confirmation
              env:
                  ACTUAL_REF: ${{ github.ref }}
                  ACTUAL_VERSION: ${{ inputs.version }}
                  ACTUAL_CHANNEL: ${{ inputs.channel }}
                  ACTUAL_CONFIRMATION: ${{ inputs.confirmation }}
              run: |
                  test "$ACTUAL_REF" = "refs/heads/main"
                  test "$ACTUAL_CONFIRMATION" = "publish $ACTUAL_VERSION with $ACTUAL_CHANNEL"

    verify:
        needs: authorize
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - name: Verify requested version
              env:
                  REQUESTED_VERSION: ${{ inputs.version }}
              run: test "$(node -p "require('./package.json').version")" = "$REQUESTED_VERSION"
            - run: npm run release:check
            - name: Verify version and channel policy
              env:
                  REQUESTED_CHANNEL: ${{ inputs.channel }}
              run: node scripts/verify-release-channel.mjs "$REQUESTED_CHANNEL"
            - name: Verify requested version is absent from npm
              run: node scripts/verify-registry.mjs unpublished
            - name: Assert exactly one verified tarball
              run: |
                  shopt -s nullglob
                  tarballs=(.artifacts/*.tgz)
                  test "${#tarballs[@]}" -eq 1
            - name: Upload verified release artifact
              uses: actions/upload-artifact@v7
              with:
                  name: release-package-${{ github.sha }}
                  path: .artifacts/*.tgz
                  if-no-files-found: error
                  include-hidden-files: true

    browser:
        needs: verify
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps ${{ matrix.browser }}
            - run: npm run build
            - run: npm run test:browser -- --project=${{ matrix.browser }}

    publish:
        needs: [verify, browser]
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - name: Download verified release artifact
              uses: actions/download-artifact@v8
              with:
                  name: release-package-${{ github.sha }}
                  path: .artifacts
            - name: Verify requested version
              env:
                  REQUESTED_VERSION: ${{ inputs.version }}
              run: test "$(node -p "require('./package.json').version")" = "$REQUESTED_VERSION"
            - name: Select the single verified tarball
              run: |
                  shopt -s nullglob
                  tarballs=(.artifacts/*.tgz)
                  test "${#tarballs[@]}" -eq 1
                  printf 'VERIFIED_TARBALL=%s\n' "${tarballs[0]}" >> "$GITHUB_ENV"
            - name: Reconfirm requested version is absent from npm
              run: node scripts/verify-registry.mjs unpublished
            - name: Publish verified tarball with npm trusted publishing
              env:
                  REQUESTED_CHANNEL: ${{ inputs.channel }}
              run: |
                  npm publish "$VERIFIED_TARBALL" \
                    --access public \
                    --tag "$REQUESTED_CHANNEL" \
                    --provenance
            - name: Verify registry propagation
              run: node scripts/verify-registry.mjs published

    github-release:
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_VERSION: ${{ inputs.version }}
                  RELEASE_CHANNEL: ${{ inputs.channel }}
              run: >-
                  gh release create "v$RELEASE_VERSION"
                  --title "ReadonlyView v$RELEASE_VERSION"
                  --target "$GITHUB_SHA"
                  --generate-notes
                  ${{ inputs.channel == 'next' && '--prerelease' || '' }}
