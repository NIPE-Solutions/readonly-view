name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run release:check
            - name: Upload packed artifact
              uses: actions/upload-artifact@v7
              with:
                  name: npm-package
                  path: .artifacts/*.tgz
                  if-no-files-found: error
                  include-hidden-files: true

    node-22:
        needs: quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run test:unit
            - run: npm run test:package

    browser:
        needs: quality
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps ${{ matrix.browser }}
            - run: npm run build
            - run: npm run test:browser -- --project=${{ matrix.browser }}
            - name: Upload Playwright failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-${{ matrix.browser }}-failure
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: warn
                  retention-days: 7
